        description: Один JSON-объект, максимум 64 КиБ. Неизвестные поля запрещены.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskCreate'
  /api/v2/tasks/{id}:
    parameters:
    - $ref: '#/components/parameters/ID'
    get:
      tags:
      - v2 / tasks
      operationId: v2_get_tasks
      summary: Получить задачу
      responses:
        '200':
          description: Успешный ответ.
          headers:
            X-Limit-Remaining:
              description: Оставшиеся запросы в минутном окне.
              schema:
                type: integer
                minimum: 0
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskSelection'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '404':
          $ref: '#/components/responses/NotFound'
      parameters:
      - $ref: '#/components/parameters/IncludeTask'
      description: ' include меняет только поля ресурсов; метаданные страницы сохраняются. Пустые, неизвестные
        и повторяющиеся имена полей запрещены.'
    put:
      tags:
      - v2 / tasks
      operationId: v2_update_tasks
      summary: Обновить задачу
      responses:
        '200':
          description: Успешный ответ.
          headers:
            X-Limit-Remaining:
              description: Оставшиеся запросы в минутном окне.
              schema:
                type: integer
                minimum: 0
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '404':
          $ref: '#/components/responses/NotFound'
      requestBody:
        required: true
        description: Один JSON-объект, максимум 64 КиБ. Неизвестные поля запрещены.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskUpdate'
      description: Полная замена изменяемых полей. ID берётся из пути. Отсутствующий ресурс не создаётся.
        Можно перенести задачу в другой проект; отсутствие description очищает описание.
    delete:
      tags:
      - v2 / tasks
      operationId: v2_delete_tasks
      summary: Удалить задачу
      responses:
        '204':
          description: Ресурс удалён, тело отсутствует.
          headers:
            X-Limit-Remaining:
              description: Оставшиеся запросы в минутном окне.
              schema:
                type: integer
                minimum: 0
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
      - v2 / tasks
      operationId: v2_patch_tasks
      summary: Частично обновить задачу
      responses:
        '200':
          description: Успешный ответ.
          headers:
            X-Limit-Remaining:
              description: Оставшиеся запросы в минутном окне.
              schema:
                type: integer
                minimum: 0
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '404':
          $ref: '#/components/responses/NotFound'
      requestBody:
        required: true
        description: Один JSON-объект, максимум 64 КиБ. Неизвестные поля запрещены.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskPatch'
      description: Изменяются только переданные поля. Пустой объект, null и неизвестные поля запрещены.
  /internal/v1/stats:
    get:
      tags:
      - internal / v1
      operationId: internal_v1_stats
      summary: Получить общую статистику
      description: Число проектов, задач и выполненных задач. Требует отдельного внутреннего ключа. Без
        настройки internal_api_key маршрут отключён (404).
      security:
      - InternalApiKeyAuth: []
      responses:
        '200':
          description: Сводка по всей базе.
          headers:
            X-Limit-Remaining:
              description: Оставшиеся запросы в минутном окне.
              schema:
                type: integer
                minimum: 0
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Stats'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
    InternalApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: Внутренний ключ из internal_api_key или INTERNAL_API_KEY.
  parameters:
    ID:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 'Ключ повторного POST: передавайте то же значение при повторе запроса.'
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: ^[!-~]+$
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Offset:
      name: offset
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
    ProjectID:
      name: project_id
      in: query
      schema:
        type: integer
        format: int64
        minimum: 1
      description: Фильтр по проекту; для отсутствующего проекта список пуст.
    Completed:
      name: completed
      in: query
      schema:
        type: boolean
      description: Только true или false.
    IncludeProject:
      name: include
      in: query
      description: Поля объекта через запятую. Без параметра возвращаются все поля.
      style: form
      explode: false
      schema:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          type: string
          enum:
          - id
          - name
      example:
      - id
      - name
    IncludeTask:
      name: include
      in: query
      description: Поля объекта через запятую. Без параметра возвращаются все поля.
      style: form
      explode: false
      schema:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          type: string
          enum:
          - id
          - project_id
          - title
          - completed
          - description
      example:
      - id
      - title
      - completed
  responses:
    BadRequest:
      description: Неверный JSON, поля, параметры или Idempotency-Key.
      headers:
        X-Limit-Remaining:
          description: Оставшиеся запросы в минутном окне.
          schema:
            type: integer
            minimum: 0
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Отсутствует или неверен X-API-Key.
      headers:
        X-Limit-Remaining:
          description: Оставшиеся запросы в минутном окне.
          schema:
            type: integer
            minimum: 0
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Ресурс или связанный проект не найден.
      headers:
        X-Limit-Remaining:
          description: Оставшиеся запросы в минутном окне.
          schema:
            type: integer
            minimum: 0
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Проект содержит задачи или ключ идемпотентности использован с другими данными.
      headers:
        X-Limit-Remaining:
          description: Оставшиеся запросы в минутном окне.
          schema:
            type: integer
            minimum: 0
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: Внутренняя ошибка сервера.
      headers:
        X-Limit-Remaining:
          description: Оставшиеся запросы в минутном окне.
          schema:
            type: integer
            minimum: 0
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: Лимит запросов исчерпан.
      headers:
        X-Limit-Remaining:
          description: Оставшиеся запросы в минутном окне.
          schema:
            type: integer
            minimum: 0
        Retry-After:
          description: Число секунд до нового окна.
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Project:
      type: object
      required:
      - id
      - name
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: Пробелы по краям удаляются перед проверкой длины.
    Task:
      type: object
      required:
      - id
      - project_id
      - title
      - completed
      - description
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        project_id:
          type: integer
          format: int64
          minimum: 1
        title:
          type: string
          minLength: 1
          maxLength: 200
          description: Пробелы по краям удаляются перед проверкой длины.
        completed:
          type: boolean
        description:
          type: string
          maxLength: 2000
    ProjectInput:
      type: object
      additionalProperties: false
      required:
      - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: Пробелы по краям удаляются перед проверкой длины.
      example:
        name: Лабораторная работа
    TaskCreate:
      type: object
      additionalProperties: false
      required:
      - project_id
      - title
      properties:
        project_id:
          type: integer
          format: int64
          minimum: 1
        title:
          type: string
          minLength: 1
          maxLength: 200
          description: Пробелы по краям удаляются перед проверкой длины.
        completed:
          type: boolean
          nullable: true
          default: false
          description: При POST отсутствие или null означает false.
        description:
          type: string
          nullable: true
          maxLength: 2000
          default: ''
          description: 'Аддитивное поле: отсутствие или null означает пустую строку, при PUT очищает описание.'
      example:
        project_id: 1
        title: Подготовить документацию
    TaskUpdate:
      type: object
      additionalProperties: false
      required:
      - project_id
      - title
      - completed
      properties:
        project_id:
          type: integer
          format: int64
          minimum: 1
        title:
          type: string
          minLength: 1
          maxLength: 200
          description: Пробелы по краям удаляются перед проверкой длины.
        completed:
          type: boolean
        description:
          type: string
          nullable: true
          maxLength: 2000
          default: ''
          description: 'Аддитивное поле: отсутствие или null означает пустую строку, при PUT очищает описание.'
      example:
        project_id: 1
        title: Подготовить документацию
        completed: true
        description: Описать API
    Error:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
        message:
          type: string
      example:
        code: project_not_empty
        message: project contains tasks
    ProjectPage:
      type: object
      required:
      - items
      - total
      - limit
      - offset
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Project'
        total:
          type: integer
          minimum: 0
          description: Количество после фильтрации, до пагинации.
        limit:
          type: integer
          minimum: 1
          maximum: 100
        offset:
          type: integer
          minimum: 0
    TaskPage:
      type: object
      required:
      - items
      - total
      - limit
      - offset
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Task'
        total:
          type: integer
          minimum: 0
          description: Количество после фильтрации, до пагинации.
        limit:
          type: integer
          minimum: 1
          maximum: 100
        offset:
          type: integer
          minimum: 0
    TaskPatch:
      type: object
      additionalProperties: false
      properties:
        project_id:
          type: integer
          format: int64
          minimum: 1
        title:
          type: string
          minLength: 1
          maxLength: 200
          description: Пробелы по краям удаляются перед проверкой длины.
        completed:
          type: boolean
        description:
          type: string
          maxLength: 2000
          description: Пустая строка очищает описание.
      example:
        completed: true
      minProperties: 1
    ProjectSelection:
      type: object
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: Пробелы по краям удаляются перед проверкой длины.
      description: Без include возвращаются все поля; с include — только выбранные.
      minProperties: 1
      additionalProperties: false
    ProjectSelectionPage:
      type: object
      required:
      - items
      - total
      - limit
      - offset
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ProjectSelection'
        total:
          type: integer
          minimum: 0
          description: Количество после фильтрации, до пагинации.
        limit:
          type: integer
          minimum: 1
          maximum: 100
        offset:
          type: integer
          minimum: 0
    TaskSelection:
      type: object
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        project_id:
          type: integer
          format: int64
          minimum: 1
        title:
          type: string
          minLength: 1
          maxLength: 200
          description: Пробелы по краям удаляются перед проверкой длины.
        completed:
          type: boolean
        description:
          type: string
          maxLength: 2000
      description: Без include возвращаются все поля; с include — только выбранные.
      minProperties: 1
      additionalProperties: false
    TaskSelectionPage:
      type: object
      required:
      - items
      - total
      - limit
      - offset
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TaskSelection'
        total:
          type: integer
          minimum: 0
          description: Количество после фильтрации, до пагинации.
        limit:
          type: integer
          minimum: 1
          maximum: 100
        offset:
          type: integer
          minimum: 0
    Stats:
      type: object
      required:
      - projects
      - tasks
      - completed_tasks
      properties:
        projects:
          type: integer
          format: int64
          minimum: 0
        tasks:
          type: integer
          format: int64
          minimum: 0
        completed_tasks:
          type: integer
          format: int64
          minimum: 0
      example:
        projects: 2
        tasks: 3
        completed_tasks: 1
