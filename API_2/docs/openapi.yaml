openapi: 3.0.3
info:
  title: Projects & Tasks API — лабораторная №2
  version: 2.1.0
  description: 'Продолжение лабораторной №1: выбор полей через include и внутренний API статистики. Без
    include ответы прежние. Пагинация сохраняется в v2. Публичный и внутренний API используют разные ключи
    X-API-Key и отдельные лимиты (по умолчанию 60 запросов/мин). /docs и /openapi.yaml доступны без ключа.'
servers:
- url: /
security:
- ApiKeyAuth: []
tags:
- name: v1 / projects
- name: v1 / tasks
- name: v2 / projects
- name: v2 / tasks
- name: internal / v1
  description: Служебная сводка для внутренних сервисов.
paths:
  /api/v1/projects:
    get:
      tags:
      - v1 / projects
      operationId: v1_list_projects
      summary: 'Список: projects'
      responses:
        '200':
          description: Успешный ответ.
          headers:
            X-Limit-Remaining:
              description: Оставшиеся запросы в минутном окне.
              schema:
                type: integer
                minimum: 0
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProjectSelection'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
      description: Сортировка по id по возрастанию; фильтры применяются совместно. Повторяющиеся и неизвестные
        параметры запрещены. В v1 пагинации нет. include меняет только поля ресурсов; метаданные страницы
        сохраняются. Пустые, неизвестные и повторяющиеся имена полей запрещены.
      parameters:
      - $ref: '#/components/parameters/IncludeProject'
    post:
      tags:
      - v1 / projects
      operationId: v1_create_projects
      summary: Создать проект
      responses:
        '201':
          description: Ресурс создан.
          headers:
            X-Limit-Remaining:
              description: Оставшиеся запросы в минутном окне.
              schema:
                type: integer
                minimum: 0
            Location:
              description: Путь к ресурсу в версии запроса.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '409':
          $ref: '#/components/responses/Conflict'
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        description: Один JSON-объект, максимум 64 КиБ. Неизвестные поля запрещены.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectInput'
  /api/v1/projects/{id}:
    parameters:
    - $ref: '#/components/parameters/ID'
    get:
      tags:
      - v1 / projects
      operationId: v1_get_projects
      summary: Получить проект
      responses:
        '200':
          description: Успешный ответ.
          headers:
            X-Limit-Remaining:
              description: Оставшиеся запросы в минутном окне.
              schema:
                type: integer
                minimum: 0
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectSelection'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '404':
          $ref: '#/components/responses/NotFound'
      parameters:
      - $ref: '#/components/parameters/IncludeProject'
      description: ' include меняет только поля ресурсов; метаданные страницы сохраняются. Пустые, неизвестные
        и повторяющиеся имена полей запрещены.'
    put:
      tags:
      - v1 / projects
      operationId: v1_update_projects
      summary: Обновить проект
      responses:
        '200':
          description: Успешный ответ.
          headers:
            X-Limit-Remaining:
              description: Оставшиеся запросы в минутном окне.
              schema:
                type: integer
                minimum: 0
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '404':
          $ref: '#/components/responses/NotFound'
      requestBody:
        required: true
        description: Один JSON-объект, максимум 64 КиБ. Неизвестные поля запрещены.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectInput'
      description: Полная замена изменяемых полей. ID берётся из пути. Отсутствующий ресурс не создаётся.
    delete:
      tags:
      - v1 / projects
      operationId: v1_delete_projects
      summary: Удалить проект
      responses:
        '204':
          description: Ресурс удалён, тело отсутствует.
          headers:
            X-Limit-Remaining:
              description: Оставшиеся запросы в минутном окне.
              schema:
                type: integer
                minimum: 0
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
      description: При наличии задач возвращается 409; сначала удалите или перенесите задачи.
    patch:
      tags:
      - v1 / projects
      operationId: v1_patch_projects
      summary: Частично обновить проект
      responses:
        '200':
          description: Успешный ответ.
          headers:
            X-Limit-Remaining:
              description: Оставшиеся запросы в минутном окне.
              schema:
                type: integer
                minimum: 0
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '404':
          $ref: '#/components/responses/NotFound'
      requestBody:
        required: true
        description: Один JSON-объект, максимум 64 КиБ. Неизвестные поля запрещены.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectInput'
      description: Изменяются только переданные поля. Пустой объект, null и неизвестные поля запрещены.
