openapi: 3.0.3
info:
  title: Projects & Tasks API
  version: 2.0.0
  description: Лабораторная работа №1. Версии используют общие данные. Все API-запросы требуют X-API-Key.
    Лимит по умолчанию — 60 запросов в минуту на ключ, общий для обеих версий; ошибки и повторы тоже учитываются.
    Без корректного ключа применяется лимит по IP. Счётчики хранятся в памяти одного процесса и сбрасываются
    при перезапуске. /docs и /openapi.yaml доступны без ключа и вне лимита API. Неподдерживаемый метод
    возвращает 405 с code/message; неизвестный маршрут — 404.
servers:
- url: /
security:
- ApiKeyAuth: []
tags:
- name: v1 / projects
- name: v1 / tasks
- name: v2 / projects
- name: v2 / tasks
paths:
  /api/v1/projects:
    get:
      tags:
      - v1 / projects
      operationId: v1_list_projects
      summary: 'Список: projects'
      responses:
        '200':
          description: Успешный ответ.
          headers:
            X-Limit-Remaining:
              description: Оставшиеся запросы в минутном окне.
              schema:
                type: integer
                minimum: 0
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
      description: Сортировка по id по возрастанию; фильтры применяются совместно. Повторяющиеся и неизвестные
        параметры запрещены. В v1 пагинации нет.
    post:
      tags:
      - v1 / projects
      operationId: v1_create_projects
      summary: Создать проект
      responses:
        '201':
          description: Ресурс создан.
          headers:
            X-Limit-Remaining:
              description: Оставшиеся запросы в минутном окне.
              schema:
                type: integer
                minimum: 0
            Location:
              description: Путь к ресурсу в версии запроса.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '409':
          $ref: '#/components/responses/Conflict'
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        description: Один JSON-объект, максимум 64 КиБ. Неизвестные поля запрещены.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectInput'
  /api/v1/projects/{id}:
    parameters:
    - $ref: '#/components/parameters/ID'
    get:
      tags:
      - v1 / projects
      operationId: v1_get_projects
      summary: Получить проект
      responses:
        '200':
          description: Успешный ответ.
          headers:
            X-Limit-Remaining:
              description: Оставшиеся запросы в минутном окне.
              schema:
                type: integer
                minimum: 0
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags:
      - v1 / projects
      operationId: v1_update_projects
      summary: Обновить проект
      responses:
        '200':
          description: Успешный ответ.
          headers:
            X-Limit-Remaining:
              description: Оставшиеся запросы в минутном окне.
              schema:
                type: integer
                minimum: 0
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '404':
          $ref: '#/components/responses/NotFound'
      requestBody:
        required: true
        description: Один JSON-объект, максимум 64 КиБ. Неизвестные поля запрещены.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectInput'
      description: Полная замена изменяемых полей. ID берётся из пути. Отсутствующий ресурс не создаётся.
    delete:
      tags:
      - v1 / projects
      operationId: v1_delete_projects
      summary: Удалить проект
      responses:
        '204':
          description: Ресурс удалён, тело отсутствует.
          headers:
            X-Limit-Remaining:
              description: Оставшиеся запросы в минутном окне.
              schema:
                type: integer
                minimum: 0
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
      description: При наличии задач возвращается 409; сначала удалите или перенесите задачи.
